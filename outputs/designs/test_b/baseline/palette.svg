<svg xmlns='http://www.w3.org/2000/svg' width='1060' height='592' viewBox='0 0 1060 592' font-family='Helvetica, Arial, sans-serif' font-size='12'>
<rect width='100%' height='100%' fill='white'/>
<text x='16' y='30' font-size='16' font-weight='bold'>PALETTE BOARD — Window-Wall Study with Corner Daybed</text>
<text x='16' y='48' font-size='11' fill='#444'>Floor finish: Engineered oak plank, 180 mm boards, matt hardwax-oil finish</text>
<rect x='16' y='64' width='110' height='110' fill='#C9A97B' stroke='#222'/><text x='140' y='82' font-size='13' font-weight='bold'>Pale oak <tspan font-weight='normal' fill='#555'>#C9A97B</tspan> <tspan font-size='10' fill='#777'>(dominant)</tspan></text><text x='140' y='104' font-size='12'>Material: Engineered oak plank, 180 mm boards</text><text x='140' y='122' font-size='12'>Finish: Matt hardwax oil</text><text x='140' y='140' font-size='12'>Used: Floor throughout</text>
<rect x='536' y='64' width='110' height='110' fill='#EFE9DF' stroke='#222'/><text x='660' y='82' font-size='13' font-weight='bold'>Chalk white <tspan font-weight='normal' fill='#555'>#EFE9DF</tspan> <tspan font-size='10' fill='#777'>(dominant)</tspan></text><text x='660' y='104' font-size='12'>Material: Mineral paint on plaster</text><text x='660' y='122' font-size='12'>Finish: Dead-matt</text><text x='660' y='140' font-size='12'>Used: All walls and ceiling</text>
<rect x='16' y='192' width='110' height='110' fill='#3F5A4C' stroke='#222'/><text x='140' y='210' font-size='13' font-weight='bold'>Bottle green <tspan font-weight='normal' fill='#555'>#3F5A4C</tspan> <tspan font-size='10' fill='#777'>(accent)</tspan></text><text x='140' y='232' font-size='12'>Material: Painted MDF joinery</text><text x='140' y='250' font-size='12'>Finish: Matt eggshell (low sheen, not gloss)</text><text x='140' y='268' font-size='12'>Used: Shelving towers, wardrobe doors, desk drawer band, blind pelmet</text>
<rect x='536' y='192' width='110' height='110' fill='#B8925F' stroke='#222'/><text x='660' y='210' font-size='13' font-weight='bold'>Warm oak <tspan font-weight='normal' fill='#555'>#B8925F</tspan> <tspan font-size='10' fill='#777'>(neutral)</tspan></text><text x='660' y='232' font-size='12'>Material: Solid oak</text><text x='660' y='250' font-size='12'>Finish: Matt hardwax oil</text><text x='660' y='268' font-size='12'>Used: Desk worktop, tower shelves, bedside table, daybed platform</text>
<rect x='16' y='320' width='110' height='110' fill='#8A7F6B' stroke='#222'/><text x='140' y='338' font-size='13' font-weight='bold'>Flax <tspan font-weight='normal' fill='#555'>#8A7F6B</tspan> <tspan font-size='10' fill='#777'>(neutral)</tspan></text><text x='140' y='360' font-size='12'>Material: Washed linen upholstery</text><text x='140' y='378' font-size='12'>Finish: Woven, stain-treated</text><text x='140' y='396' font-size='12'>Used: Daybed mattress cover and bolsters</text>
<rect x='536' y='320' width='110' height='110' fill='#D8D1C5' stroke='#222'/><text x='660' y='338' font-size='13' font-weight='bold'>Oatmeal <tspan font-weight='normal' fill='#555'>#D8D1C5</tspan> <tspan font-size='10' fill='#777'>(neutral)</tspan></text><text x='660' y='360' font-size='12'>Material: Undyed wool flatweave</text><text x='660' y='378' font-size='12'>Finish: Natural</text><text x='660' y='396' font-size='12'>Used: Rug; linen pinboard strip above desk</text>
<rect x='16' y='448' width='110' height='110' fill='#2B2B2B' stroke='#222'/><text x='140' y='466' font-size='13' font-weight='bold'>Charcoal <tspan font-weight='normal' fill='#555'>#2B2B2B</tspan> <tspan font-size='10' fill='#777'>(accent)</tspan></text><text x='140' y='488' font-size='12'>Material: Powder-coated steel</text><text x='140' y='506' font-size='12'>Finish: Matte</text><text x='140' y='524' font-size='12'>Used: Desk chair frame, wall reading light, window hardware, door handle</text>
