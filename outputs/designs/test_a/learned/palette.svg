<text x='16' y='30' font-size='16' font-weight='bold'>PALETTE BOARD — Low living bar with a brick hearth core and a south ribbon</text>
<text x='16' y='48' font-size='11' fill='#444'>Floor finish: European oak wide boards 180 mm, hardwax-oiled matt, laid east-west along the long axis</text>
