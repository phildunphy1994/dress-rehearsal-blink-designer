<rect x='16' y='192' width='110' height='110' fill='#EFE6D6' stroke='#222'/><text x='140' y='210' font-size='13' font-weight='bold'>Warm lime plaster <tspan font-weight='normal' fill='#555'>#EFE6D6</tspan> <tspan font-size='10' fill='#777'>(neutral)</tspan></text><text x='140' y='232' font-size='12'>Material: Lime plaster</text><text x='140' y='250' font-size='12'>Finish: Matt (no gloss)</text><text x='140' y='268' font-size='12'>Used: North and east wall fields, soffit band, flat ceiling</text>
<rect x='536' y='192' width='110' height='110' fill='#B98E5E' stroke='#222'/><text x='660' y='210' font-size='13' font-weight='bold'>Oiled oak floor <tspan font-weight='normal' fill='#555'>#B98E5E</tspan> <tspan font-size='10' fill='#777'>(dominant)</tspan></text><text x='660' y='232' font-size='12'>Material: European oak wide boards 180 mm (floor finish)</text><text x='660' y='250' font-size='12'>Finish: Hardwax oil, matt, laid east-west</text><text x='660' y='268' font-size='12'>Used: Whole floor</text>
<rect x='16' y='320' width='110' height='110' fill='#8F6436' stroke='#222'/><text x='140' y='338' font-size='13' font-weight='bold'>Dark oiled oak joinery <tspan font-weight='normal' fill='#555'>#8F6436</tspan> <tspan font-size='10' fill='#777'>(accent)</tspan></text><text x='140' y='360' font-size='12'>Material: European oak</text><text x='140' y='378' font-size='12'>Finish: Hardwax oil, satin</text><text x='140' y='396' font-size='12'>Used: Entry door, screen, coat press, log store, bench, chairs, table, windo</text>
<rect x='536' y='320' width='110' height='110' fill='#6B3A2A' stroke='#222'/><text x='660' y='338' font-size='13' font-weight='bold'>Oxblood leather <tspan font-weight='normal' fill='#555'>#6B3A2A</tspan> <tspan font-size='10' fill='#777'>(accent)</tspan></text><text x='660' y='360' font-size='12'>Material: Vegetable-tanned leather over wool stuffing</text><text x='660' y='378' font-size='12'>Finish: Waxed</text><text x='660' y='396' font-size='12'>Used: Bench seat cushion, armchair seats and backs</text>
<rect x='16' y='448' width='110' height='110' fill='#B87333' stroke='#222'/><text x='140' y='466' font-size='13' font-weight='bold'>Copper <tspan font-weight='normal' fill='#555'>#B87333</tspan> <tspan font-size='10' fill='#777'>(accent)</tspan></text><text x='140' y='488' font-size='12'>Material: Spun / sheet copper</text><text x='140' y='506' font-size='12'>Finish: Natural, unlacquered</text><text x='140' y='524' font-size='12'>Used: Pendant shades over the table, planter liner</text>
