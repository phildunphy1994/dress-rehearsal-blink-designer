<svg xmlns='http://www.w3.org/2000/svg' width='1060' height='592' viewBox='0 0 1060 592' font-family='Helvetica, Arial, sans-serif' font-size='12'>
<rect width='100%' height='100%' fill='white'/>
<text x='16' y='30' font-size='16' font-weight='bold'>PALETTE BOARD — Study-bedroom under a continuous head band</text>
<text x='16' y='48' font-size='11' fill='#444'>Floor finish: Fumed European oak boards 180 mm wide, hardwax-oil matt, laid east-west along the long axis; entry gallery strip (x 0.00-1.00) in unglazed red quarry tile 150 x 300 mm, matt penetrating sealer, laid in horizontal running courses</text>
<rect x='16' y='64' width='110' height='110' fill='#A1673F' stroke='#222'/><text x='140' y='82' font-size='13' font-weight='bold'>Tawny brick <tspan font-weight='normal' fill='#555'>#A1673F</tspan> <tspan font-size='10' fill='#777'>(dominant)</tspan></text><text x='140' y='104' font-size='12'>Material: Clay brick, horizontal coursing only</text><text x='140' y='122' font-size='12'>Finish: Raked horizontal joints, flush-struck vertical joints, clear matt sealer</text><text x='140' y='140' font-size='12'>Used: East wall full height, south window-wall piers, back wall behind desk </text>
