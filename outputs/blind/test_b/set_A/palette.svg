<rect x='16' y='192' width='110' height='110' fill='#8C5A2E' stroke='#222'/><text x='140' y='210' font-size='13' font-weight='bold'>Oiled oak <tspan font-weight='normal' fill='#555'>#8C5A2E</tspan> <tspan font-size='10' fill='#777'>(dominant)</tspan></text><text x='140' y='232' font-size='12'>Material: Quarter-sawn European oak</text><text x='140' y='250' font-size='12'>Finish: Hardwax oil, matt</text><text x='140' y='268' font-size='12'>Used: Desk, shelving, closet press, bed platform, ledge, chair, entry door, </text>
<rect x='536' y='192' width='110' height='110' fill='#6B4A2E' stroke='#222'/><text x='660' y='210' font-size='13' font-weight='bold'>Fumed oak floor <tspan font-weight='normal' fill='#555'>#6B4A2E</tspan> <tspan font-size='10' fill='#777'>(dominant)</tspan></text><text x='660' y='232' font-size='12'>Material: Fumed European oak boards 180 mm</text><text x='660' y='250' font-size='12'>Finish: Hardwax oil, matt</text><text x='660' y='268' font-size='12'>Used: Floor of study field and sleeping bay, laid east-west</text>
<rect x='16' y='320' width='110' height='110' fill='#8A3F2B' stroke='#222'/><text x='140' y='338' font-size='13' font-weight='bold'>Red quarry tile <tspan font-weight='normal' fill='#555'>#8A3F2B</tspan> <tspan font-size='10' fill='#777'>(accent)</tspan></text><text x='140' y='360' font-size='12'>Material: Unglazed clay quarry tile 150 x 300 mm</text><text x='140' y='378' font-size='12'>Finish: Matt penetrating sealer</text><text x='140' y='396' font-size='12'>Used: Entry gallery floor strip x 0.00-1.00</text>
<rect x='536' y='320' width='110' height='110' fill='#E6DAC6' stroke='#222'/><text x='660' y='338' font-size='13' font-weight='bold'>Warm stippled plaster <tspan font-weight='normal' fill='#555'>#E6DAC6</tspan> <tspan font-size='10' fill='#777'>(neutral)</tspan></text><text x='660' y='360' font-size='12'>Material: Lime plaster</text><text x='660' y='378' font-size='12'>Finish: Stippled texture, matt limewash</text><text x='660' y='396' font-size='12'>Used: Ceiling field and soffits; framed infill panels in the window band</text>
