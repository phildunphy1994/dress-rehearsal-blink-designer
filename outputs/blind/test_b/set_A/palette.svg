<rect x='536' y='448' width='110' height='110' fill='#5E3224' stroke='#222'/><text x='660' y='466' font-size='13' font-weight='bold'>Oxblood leather <tspan font-weight='normal' fill='#555'>#5E3224</tspan> <tspan font-size='10' fill='#777'>(accent)</tspan></text><text x='660' y='488' font-size='12'>Material: Aniline leather over stuffing</text><text x='660' y='506' font-size='12'>Finish: Waxed</text><text x='660' y='524' font-size='12'>Used: Chair seat and back pad, bed bolster</text>
