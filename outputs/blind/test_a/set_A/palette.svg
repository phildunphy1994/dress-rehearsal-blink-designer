<text x='16' y='30' font-size='16' font-weight='bold'>PALETTE BOARD — Living room: hearth wall, ribbon window and oak entry screen</text>
<text x='16' y='48' font-size='11' fill='#444'>Floor finish: Smoked European oak engineered wide boards (220 mm), matt hardwax oil, laid east-west along the room length</text>
