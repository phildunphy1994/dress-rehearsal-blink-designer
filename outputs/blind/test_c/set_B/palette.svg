<svg xmlns='http://www.w3.org/2000/svg' width='1060' height='592' viewBox='0 0 1060 592' font-family='Helvetica, Arial, sans-serif' font-size='12'>
<rect width='100%' height='100%' fill='white'/>
<text x='16' y='30' font-size='16' font-weight='bold'>PALETTE BOARD — Dining-living room with end-wall hearth and dropped dining canopy</text>
<text x='16' y='48' font-size='11' fill='#444'>Floor finish: Engineered oak plank, 190 mm boards laid along x, matt hardwax-oil finish</text>
<rect x='16' y='64' width='110' height='110' fill='#D2B48C' stroke='#222'/><text x='140' y='82' font-size='13' font-weight='bold'>Pale oak <tspan font-weight='normal' fill='#555'>#D2B48C</tspan> <tspan font-size='10' fill='#777'>(dominant)</tspan></text><text x='140' y='104' font-size='12'>Material: Engineered oak plank, 190 mm</text><text x='140' y='122' font-size='12'>Finish: Matt hardwax oil</text><text x='140' y='140' font-size='12'>Used: Floor throughout, boards laid along x</text>
<rect x='536' y='64' width='110' height='110' fill='#EDE6D6' stroke='#222'/><text x='660' y='82' font-size='13' font-weight='bold'>Chalk <tspan font-weight='normal' fill='#555'>#EDE6D6</tspan> <tspan font-size='10' fill='#777'>(dominant)</tspan></text><text x='660' y='104' font-size='12'>Material: Mineral (silicate) paint on plaster</text><text x='660' y='122' font-size='12'>Finish: Matt</text><text x='660' y='140' font-size='12'>Used: All walls, main ceiling, chimney breast, skirtings and window frames</text>
<rect x='16' y='192' width='110' height='110' fill='#3F4A44' stroke='#222'/><text x='140' y='210' font-size='13' font-weight='bold'>Moss slate <tspan font-weight='normal' fill='#555'>#3F4A44</tspan> <tspan font-size='10' fill='#777'>(accent)</tspan></text><text x='140' y='232' font-size='12'>Material: Emulsion on plasterboard</text><text x='140' y='250' font-size='12'>Finish: Matt</text><text x='140' y='268' font-size='12'>Used: Dining canopy soffit and fascia</text>
<rect x='536' y='192' width='110' height='110' fill='#B9AE9A' stroke='#222'/><text x='660' y='210' font-size='13' font-weight='bold'>Limestone <tspan font-weight='normal' fill='#555'>#B9AE9A</tspan> <tspan font-size='10' fill='#777'>(neutral)</tspan></text><text x='660' y='232' font-size='12'>Material: Honed limestone</text><text x='660' y='250' font-size='12'>Finish: Honed</text><text x='660' y='268' font-size='12'>Used: Hearth slab, fire surround, coffee table top</text>
<rect x='16' y='320' width='110' height='110' fill='#2A2A28' stroke='#222'/><text x='140' y='338' font-size='13' font-weight='bold'>Charcoal <tspan font-weight='normal' fill='#555'>#2A2A28</tspan> <tspan font-size='10' fill='#777'>(neutral)</tspan></text><text x='140' y='360' font-size='12'>Material: Blackened mild steel</text><text x='140' y='378' font-size='12'>Finish: Waxed</text><text x='140' y='396' font-size='12'>Used: Fire insert, mantel shelf, log niche lining, table trestles, pendant a</text>
<rect x='536' y='320' width='110' height='110' fill='#8B6F4E' stroke='#222'/><text x='660' y='338' font-size='13' font-weight='bold'>Smoked oak <tspan font-weight='normal' fill='#555'>#8B6F4E</tspan> <tspan font-size='10' fill='#777'>(neutral)</tspan></text><text x='660' y='360' font-size='12'>Material: Smoked oak, solid and veneer</text><text x='660' y='378' font-size='12'>Finish: Matt oil</text><text x='660' y='396' font-size='12'>Used: Dining table, chairs, banquette carcass, flank joinery, side table</text>
